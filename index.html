<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายรับรายจ่าย 1 เดือน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2f5;--card:#fff;--ink:#191b26;--mut:#6b7080;--line:#e6e8ee;--blue:#2f6fe4;--green:#0fa86f;--red:#e9502a;--yel:#ffd21f;--chip:#f4f5f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--ink:#f1f2f6;--mut:#9aa0b3;--line:#2a2e3d;--blue:#3d78ea;--green:#2fd197;--red:#ff7650;--chip:#252938;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--ink:#f1f2f6;--mut:#9aa0b3;--line:#2a2e3d;--blue:#3d78ea;--green:#2fd197;--red:#ff7650;--chip:#252938;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding:14px 14px 110px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.app{grid-template-columns:1fr 1fr;align-items:start;padding-top:28px}}
.col{display:grid;gap:14px}
.card{background:var(--card);border-radius:22px;padding:16px}
h2{font-size:16px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 img{width:34px;height:34px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:2px 2px}
.nav b{font-size:19px;font-weight:600}
.nav button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:18px}
.hero{background:var(--blue);color:#fff;border-radius:26px;padding:20px 18px 16px;position:relative;overflow:hidden}
.hero small{opacity:.85}
.hero .bal{font-size:38px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin:2px 0 14px}
.hero .bag{position:absolute;right:6px;top:4px;width:112px;height:112px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.chip img{width:40px;height:40px}
.chip span{display:block;font-size:12px;opacity:.85}
.chip b{font-size:17px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--card);border-radius:20px;padding:14px;display:flex;gap:10px;align-items:center}
.stat img{width:46px;height:46px}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:17px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px}
.bars i{flex:1;background:var(--chip);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.bars i.v{background:var(--blue)}
.bars i.t{background:var(--red)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row img{width:44px;height:44px;flex:none}
.row .m{flex:1;min-width:0}
.row .m b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--chip);margin-top:5px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--blue);border-radius:6px}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--green)}.amt.ex{color:var(--red)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:12px 0 2px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:0}
.del{border:0;background:none;color:var(--mut);font-size:16px;width:32px;height:32px;border-radius:50%}
.empty{text-align:center;padding:14px 6px;color:var(--mut)}
.empty img{width:92px;height:92px}
.empty button,.save{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:var(--ink);color:var(--bg);border-radius:30px;padding:15px 26px;font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,12,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:26px}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{border:2px solid transparent;background:var(--chip);border-radius:16px;padding:8px 2px 6px;font-size:11.5px;text-align:center;line-height:1.25}
.cat img{width:48px;height:48px;display:block;margin:0 auto 2px}
.cat.on{border-color:var(--blue)}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px}
.f{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 13px;font:inherit;margin-bottom:10px}
.f.big{font-size:26px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{width:100%;font-size:16px;margin-top:4px}
.err{color:var(--red);font-size:13px;min-height:18px}
.link{border:0;background:none;color:var(--mut);font-size:12px;text-decoration:underline;padding:8px}
@media(prefers-reduced-motion:no-preference){.hero .bag{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}}
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <div class="nav"><button onclick="mv(-1)" aria-label="เดือนก่อนหน้า">‹</button><b id="mlabel"></b><button onclick="mv(1)" aria-label="เดือนถัดไป">›</button></div>
    <div class="hero" id="hero"></div>
    <div class="stats" id="stats"></div>
    <div class="card"><h2>รายจ่ายรายวัน</h2><div class="bars" id="bars"></div><div class="axis" id="axis"></div></div>
  </div>
  <div class="col">
    <div class="card"><h2><img id="ana" alt="">รายจ่ายตามหมวด</h2><div id="brk"></div></div>
    <div class="card"><h2>รายการทั้งหมด</h2><div id="list"></div></div>
    <div style="text-align:center"><button class="link" onclick="clr()">ล้างข้อมูลเดือนนี้</button><div id="sync" class="link" style="text-decoration:none;padding-top:0" role="status"></div></div>
  </div>
</div>
<button class="fab" onclick="openSheet()">+ เพิ่มรายการ</button>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-label="เพิ่มรายการ">
    <div class="seg"><button id="sx" onclick="setT('exp')">รายจ่าย</button><button id="si" onclick="setT('inc')">รายรับ</button></div>
    <div class="cats" id="cats"></div>
    <label for="amt">จำนวนเงิน (บาท)</label>
    <input class="f big" id="amt" inputmode="decimal" placeholder="0">
    <div class="two">
      <div><label for="dt">วันที่</label><input class="f" id="dt" type="date"></div>
      <div><label for="note">บันทึก</label><input class="f" id="note" placeholder="เช่น ข้าวเที่ยง" maxlength="40"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="save" onclick="add()">บันทึก</button>
  </div>
</div>

const CATS = {
  exp:[{id:'general',n:'ใช้จ่ายทั่วไป',i:'wallet'},{id:'card',n:'บัตรเครดิต',i:'cards'},{id:'bill',n:'บิลรายเดือน',i:'calendar'},{id:'inst',n:'ผ่อนชำระ',i:'clock'},{id:'ins',n:'ประกัน',i:'lock'},{id:'save',n:'ออมเงิน',i:'piggy'},{id:'rsv',n:'เงินสำรอง',i:'safe'}],
  inc:[{id:'sal',n:'เงินเดือน',i:'bag'},{id:'side',n:'รายได้เสริม',i:'cash'},{id:'oth',n:'อื่นๆ',i:'coins'}]
};
const find=(t,c)=>CATS[t].find(x=>x.id===c)||CATS[t][0];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=n=>Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const now=new Date(), today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
let ym=today.slice(0,7), tx=[], type='exp', cat='general';
try{tx=JSON.parse(localStorage.getItem('mt_tx')||'[]')}catch(e){tx=[]}
let col=null;
const setSync=s=>{$('sync').textContent=s};
const persist=(ms=[])=>{try{localStorage.setItem('mt_tx',JSON.stringify(tx))}catch(e){}
  if(col)ms.forEach(m=>col.doc('m-'+m).set({tx:tx.filter(x=>x.d.startsWith(m))}).catch(()=>setSync('บันทึกขึ้นคลาวด์ไม่สำเร็จ ลองใหม่อีกครั้ง')))};
async function initCloud(){
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user&&await user.id();
    if(!db||!uid){setSync('เก็บในเครื่องนี้เท่านั้น');return}
    col=db.collection('data/users/'+uid);
    let first=true;
    col.onSnapshot(snap=>{
      if(snap.metadata.fromCache&&snap.empty)return;
      let cloud=[];snap.docs.forEach(d=>{const a=(d.data()||{}).tx;if(Array.isArray(a))cloud=cloud.concat(a)});
      if(first){first=false;let mig=null;try{mig=localStorage.getItem('mt_mig')}catch(e){}
        if(!mig){const ids=new Set(cloud.map(x=>x.id));const extra=tx.filter(x=>!ids.has(x.id));
          try{localStorage.setItem('mt_mig','1')}catch(e){}
          tx=cloud.concat(extra);persist([...new Set(extra.map(x=>x.d.slice(0,7)))]);setSync('ซิงก์แล้ว');render();return}}
      tx=cloud;try{localStorage.setItem('mt_tx',JSON.stringify(tx))}catch(e){}
      setSync('ซิงก์แล้ว');render();
    },()=>setSync('เก็บในเครื่องนี้เท่านั้น'));
  }catch(e){setSync('เก็บในเครื่องนี้เท่านั้น')}
}
$('ana').src=IC.analytics;

function mv(d){let[y,m]=ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+'-'+pad(m);render()}

function render(){
  const [y,m]=ym.split('-').map(Number), dim=new Date(y,m,0).getDate();
  $('mlabel').textContent=new Date(y,m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const L=tx.filter(x=>x.d.startsWith(ym)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const inc=L.filter(x=>x.t==='inc').reduce((s,x)=>s+x.a,0), exp=L.filter(x=>x.t==='exp').reduce((s,x)=>s+x.a,0), bal=inc-exp;
  $('hero').innerHTML=`<img class="bag" src="${IC.bag}" alt=""><small>คงเหลือเดือนนี้</small><div class="bal">฿${fmt(bal)}</div>
   <div class="chips"><div class="chip"><img src="${IC.coins}" alt=""><div><span>รายรับ</span><b>฿${fmt(inc)}</b></div></div>
   <div class="chip"><img src="${IC.wallet}" alt=""><div><span>รายจ่าย</span><b>฿${fmt(exp)}</b></div></div></div>`;
  const elapsed=ym===today.slice(0,7)?now.getDate():dim;
  const saved=L.filter(x=>x.t==='exp'&&x.c==='save').reduce((s,x)=>s+x.a,0);
  $('stats').innerHTML=`<div class="stat"><img src="${IC.calc}" alt=""><div><span>จ่ายเฉลี่ยต่อวัน</span><b>฿${fmt(exp/elapsed)}</b></div></div>
   <div class="stat"><img src="${IC.piggy}" alt=""><div><span>ออมแล้ว</span><b>฿${fmt(saved)}</b></div></div>`;
  // daily bars
  const per=Array(dim+1).fill(0);L.filter(x=>x.t==='exp').forEach(x=>per[+x.d.slice(8)]+=x.a);
  const mx=Math.max(...per,1);
  $('bars').innerHTML=per.slice(1).map((v,i)=>`<i class="${v?'v':''}${ym+'-'+pad(i+1)===today?' t':''}" style="height:${Math.max(3,v/mx*100)}%" title="${i+1}: ฿${fmt(v)}"></i>`).join('');
  $('axis').innerHTML=`<span>1</span><span>${Math.round(dim/2)}</span><span>${dim}</span>`;
  // breakdown
  const g={};L.filter(x=>x.t==='exp').forEach(x=>g[x.c]=(g[x.c]||0)+x.a);
  const gk=Object.keys(g).sort((a,b)=>g[b]-g[a]);
  $('brk').innerHTML=gk.length?gk.map(k=>{const c=find('exp',k),p=g[k]/exp*100;return`<div class="row"><img src="${IC[c.i]}" alt=""><div class="m"><b>${c.n}</b><div class="bar"><u style="width:${p}%"></u></div></div><div class="amt">฿${fmt(g[k])}<div style="font-size:11px;color:var(--mut);font-weight:400;text-align:right">${p.toFixed(0)}%</div></div></div>`}).join(''):'<div class="empty">ยังไม่มีรายจ่ายในเดือนนี้</div>';
  // list
  if(!L.length){$('list').innerHTML=`<div class="empty"><img src="${IC.piggy}" alt=""><p>เดือนนี้ยังไม่มีรายการ<br>กด “เพิ่มรายการ” เพื่อเริ่มจดได้เลย</p><button onclick="demo()">ลองด้วยข้อมูลตัวอย่าง</button></div>`;return}
  let h='',last='';
  L.forEach(x=>{
    if(x.d!==last){last=x.d;const net=L.filter(z=>z.d===x.d).reduce((s,z)=>s+(z.t==='inc'?z.a:-z.a),0);
      const [yy,mm,dd]=x.d.split('-').map(Number);
      h+=`<div class="day"><span>${new Date(yy,mm-1,dd).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'})}</span><span>${net<0?'-':'+'}฿${fmt(Math.abs(net))}</span></div>`}
    const c=find(x.t,x.c);
    h+=`<div class="row"><img src="${IC[c.i]}" alt=""><div class="m"><b>${c.n}</b>${x.n?`<span>${esc(x.n)}</span>`:''}</div><div class="amt ${x.t==='inc'?'in':'ex'}">${x.t==='inc'?'+':'-'}฿${fmt(x.a)}</div><button class="del" aria-label="ลบรายการ" onclick="del(${x.id})">✕</button></div>`;
  });
  $('list').innerHTML=h;
}

function setT(t){type=t;cat=CATS[t][0].id;$('sx').className=t==='exp'?'on':'';$('si').className=t==='inc'?'on':'';
  $('cats').innerHTML=CATS[t].map(c=>`<button class="cat${c.id===cat?' on':''}" onclick="pick('${c.id}')"><img src="${IC[c.i]}" alt="">${c.n}</button>`).join('')}
function pick(c){cat=c;[...$('cats').children].forEach((b,i)=>b.classList.toggle('on',CATS[type][i].id===c))}
function openSheet(){setT('exp');$('amt').value='';$('note').value='';$('err').textContent='';$('dt').value=ym===today.slice(0,7)?today:ym+'-01';$('ov').classList.add('open');setTimeout(()=>$('amt').focus(),50)}
function closeSheet(){$('ov').classList.remove('open')}
function add(){
  const a=parseFloat(String($('amt').value).replace(/,/g,'')), d=$('dt').value;
  if(!(a>0)){$('err').textContent='ใส่จำนวนเงินที่มากกว่า 0';return}
  if(!d){$('err').textContent='เลือกวันที่';return}
  tx.push({id:Date.now(),t:type,c:cat,a:Math.round(a*100)/100,n:$('note').value.trim(),d});
  persist([d.slice(0,7)]);ym=d.slice(0,7);closeSheet();render();
}
function del(id){const x=tx.find(z=>z.id===id);if(!x)return;tx=tx.filter(z=>z.id!==id);persist([x.d.slice(0,7)]);render()}
function clr(){const n=tx.filter(x=>x.d.startsWith(ym)).length;if(!n)return;if(confirm('ลบทั้ง '+n+' รายการของเดือนนี้?')){tx=tx.filter(x=>!x.d.startsWith(ym));persist([ym]);render()}}
function demo(){
  const s=[['inc','sal',32000,'เงินเดือน',1],['inc','side',4500,'งานฟรีแลนซ์',12],['exp','bill',6500,'ค่าเช่าห้อง',2],['exp','bill',1180,'ค่าไฟ + น้ำ',5],['exp','general',185,'ข้าวเที่ยง',3],['exp','general',420,'ซุปเปอร์มาร์เก็ต',6],['exp','card',3200,'ชำระบัตร',8],['exp','inst',2100,'ผ่อนมือถือ',10],['exp','general',260,'กาแฟ + ขนม',11],['exp','ins',1500,'เบี้ยประกัน',14],['exp','save',5000,'โอนเข้าบัญชีออม',15],['exp','rsv',2000,'เงินสำรองฉุกเฉิน',15],['exp','general',640,'เติมน้ำมัน',17]];
  const last=ym===today.slice(0,7)?now.getDate():28;
  s.forEach((r,i)=>{if(r[4]<=last)tx.push({id:Date.now()+i,t:r[0],c:r[1],a:r[2],n:r[3],d:ym+'-'+pad(r[4])})});
  persist([ym]);render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();initCloud();
</script>
</body>
